# GUIKit Configuration
# Generated by GUIKit Web Editor
# This file configures which GUI is loaded by default on the ESP8266

# Default GUI project name (without .GUIKIT suffix)
# Set to empty to use the default /gui/main_gui.json
default_gui=chooser

# Path to GUI directory on SD card
gui_path=/gui

# Use .GUIKIT directories for projects (true) or flat files (false)
use_project_dirs=true

# Auto-load the last used GUI on startup
auto_load_last=true

# Last loaded GUI (updated automatically when auto_load_last=true)
last_gui=chooser
