; ============================================================================
; GUIKit Autostart Configuration
; 
; This file controls:
;   - Which kernel.bin to load
;   - Memory strategy (external RAM, SD swap, internal RAM)
;   - Which GUI to start automatically
;   - Memory bank allocation rules
; 
; Lines starting with ; or # are comments
; Sections are in [square brackets]
; Key = Value pairs define settings
; 
; Date: 2026-08-15
; ============================================================================

[kernel]
; Path to kernel binary file
; Can be absolute path on SD card
; If not found, bootloader will search common locations
path = /kernel.bin

; Is kernel compressed with gzip?
compress = false

; Expected kernel size (0 = any size)
; If non-zero, bootloader will verify size matches
expected_size = 0

; Maximum allowed kernel size (0 = no limit)
; If kernel is larger than this, bootloader will reject it
max_size = 0

; Verify kernel checksum after loading
; Requires CRC32 value to be stored somewhere
verify = true


[memory]
; Memory strategy determines which bank to try first
; Options: auto, external_first, sd_swap_first, internal_only, custom
; 
; auto - Try external RAM, then SD swap, then internal RAM
; external_first - Try external RAM first, then SD swap, then internal
; sd_swap_first - Try SD swap first, then external RAM, then internal
; internal_only - Only use internal RAM (no external/SD)
; custom - Use custom allocation rules from [allocations] section
strategy = auto

; If true, stop trying banks after first successful allocation
; If false, keep trying banks for best fit
stop_at_first_success = true

; Memory bank configuration
; Each bank can be enabled/disabled independently
; The bootloader will only use enabled AND available banks

; Internal RAM (always available)
; On ESP8266: ~80KB
; On ESP32: ~320KB
internal.enabled = true

; External RAM (SRAM/PSRAM)
; Detected automatically if hardware present
external.enabled = true

; SD Swap (uses SD card for swap space)
; Requires SD card to be present and initialized
sd_swap.enabled = true


[gui]
; Path to GUI directory or JSON file
; Can be a .GUIKIT directory or a .json file
path = /gui/chooser.GUIKIT

; Auto-start this GUI after kernel loads
auto_start = true

; Theme to use for the GUI
theme = default

; GUI dimensions (0 = auto-detect from GUI file)
width = 0
height = 0


[allocations]
; Memory allocation rules for specific resources
; Used when strategy = custom
; 
; Format:
; name = <resource_name>
; bank = <internal|external|sd_swap>
; fallback = <internal|external|sd_swap>
; size = <size_in_bytes>
; replace = <true|false>
; 
; Example: Allocate GUI widgets in external RAM, fall back to SD swap

; GUI widget memory
name = gui_widgets
bank = external
fallback = sd_swap
size = 65536
replace = false

; Text editor buffers
name = text_editor
bank = external
fallback = sd_swap
size = 32768
replace = false

; Image cache
name = image_cache
bank = sd_swap
fallback = external
size = 131072
replace = true

; Font cache
name = font_cache
bank = internal
fallback = external
size = 16384
replace = true


[flags]
; Enable debug output to serial
debug = false

; Show boot messages on TFT (if available)
tft_boot_messages = true

; Show boot messages on serial
serial_boot_messages = true
