; ============================================================================
; PlatformIO Configuration for GUIKit Project
; 
; Supports both ESP8266 and ESP32 with conditional compilation
; Uses the same codebase with preprocessor directives for MCU-specific code
; 
; Generated by Mistral Vibe
; Date: 2026-08-15
; ============================================================================

[platformio]
; Default environment - can be overridden with -e flag
default_envs = esp8266_default

; ============================================================================
; Common Configuration for All Environments
; ============================================================================

[env]
platform = espressif
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, default
build_type = debug

; Source files - same for both MCUs
src_dir = src
src_build_flags =
    -DGUIKIT_PROJECT
    -DARDUINO_USB_CDC_ON_BOOT=1

; Include paths
build_flags =
    -I src
    -I src/boot
    -I src/gui
    -I src/gui_editor/server
    -I src/examples

; Enable SPI, I2C, and other peripherals
board_build.f_cpu = 160000000L
board_build.arduino.lto = true
board_build.arduino.fft = false

; ============================================================================
; ESP8266 Environments
; ============================================================================

[esp8266_default]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DESP8266 -GUIKIT_PLATFORM_ESP8266=1 -GUIKIT_PLATFORM_ESP32=0
lib_deps =
    ; Add ESP8266-specific libraries here

[esp8266_bootloader]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DESP8266 -GUIKIT_PLATFORM_ESP8266=1 -GUIKIT_PLATFORM_ESP32=0 -DBUILD_BOOTLOADER
src_filter = +<src/boot/*> +<src/guikit_hw_config.*>

[esp8266_kernel]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DESP8266 -GUIKIT_PLATFORM_ESP8266=1 -GUIKIT_PLATFORM_ESP32=0 -DBUILD_KERNEL
src_filter = +<*> -<src/boot/*>

[esp8266_huge_demo]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DESP8266 -GUIKIT_PLATFORM_ESP8266=1 -GUIKIT_PLATFORM_ESP32=0 -DGUIKIT_HW_ESP8266_HUGE_DEMO
lib_deps =
    ; Add libraries for huge demo

; ============================================================================
; ESP32 Environments
; ============================================================================

[esp32_default]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DESP32 -GUIKIT_PLATFORM_ESP8266=0 -GUIKIT_PLATFORM_ESP32=1
lib_deps =
    ; Add ESP32-specific libraries here

[esp32_bootloader]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DESP32 -GUIKIT_PLATFORM_ESP8266=0 -GUIKIT_PLATFORM_ESP32=1 -DBUILD_BOOTLOADER
src_filter = +<src/boot/*> +<src/guikit_hw_config.*>

[esp32_kernel]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DESP32 -GUIKIT_PLATFORM_ESP8266=0 -GUIKIT_PLATFORM_ESP32=1 -DBUILD_KERNEL
src_filter = +<*> -<src/boot/*>

[esp32_premium]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DESP32 -GUIKIT_PLATFORM_ESP8266=0 -GUIKIT_PLATFORM_ESP32=1 -DGUIKIT_HW_ESP32_PREMIUM
lib_deps =
    ; Add libraries for premium ESP32 build

; ============================================================================
; Custom Board Configurations
; ============================================================================

; ESP8266 with external SRAM (23LC1024)
[esp8266_ext_ram]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DESP8266 -GUIKIT_PLATFORM_ESP8266=1 -GUIKIT_PLATFORM_ESP32=0 -DGUIKIT_HAS_EXTERNAL_RAM=1

; ESP32 with PSRAM
[esp32_psram]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = ${env.build_flags} -DESP32 -GUIKIT_PLATFORM_ESP8266=0 -GUIKIT_PLATFORM_ESP32=1 -DGUIKIT_HAS_PSRAM=1

; ============================================================================
; Flash Partition Layout
; ============================================================================

; Partition table for ESP32 (optional - can be specified per environment)
; The config partition at 0x10000 stores hardware configuration
; This allows runtime detection of MCU type and hardware config

[env:esp32_partition]
board_build.partitions = default_8MB.csv
; Custom partition table:
; 0x0000-0x1000 : Bootloader
; 0x1000-0x8000 : NVS
; 0x8000-0x9000 : OTADATA
; 0x9000-0x10000: Phy_init
; 0x10000-0x11000: Config (4KB partition for GUIKit config)
; 0x11000-0x20000: Kernel
; 0x20000-...   : Storage (SPIFFS/FAT)

; ============================================================================
; Upload Configuration
; ============================================================================

[env:upload_esp8266]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_protocol = esptool
upload_speed = 115200
upload_port = /dev/ttyUSB0

[env:upload_esp32]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_speed = 115200
upload_port = /dev/ttyUSB0

; ============================================================================
; Debug Configuration
; ============================================================================

[env:debug_esp8266]
platform = espressif8266
board = esp01_1m
framework = arduino
debug_tool = esp-prog
debug_speed = 115200
build_type = debug

[env:debug_esp32]
platform = espressif32
board = esp32dev
framework = arduino
debug_tool = esp-prog
debug_speed = 115200
build_type = debug

; ============================================================================
; Custom Build Flags for Memory Strategies
; ============================================================================

; Force external RAM usage (if available)
[env:force_external_ram]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DGUIKIT_FORCE_EXTERNAL_RAM=1

; Force SD card swap
[env:force_sd_swap]
platform = espressif8266
board = esp01_1m
framework = arduino
build_flags = ${env.build_flags} -DGUIKIT_FORCE_SD_SWAP=1

; ============================================================================
; Usage Notes:
; ============================================================================
; 
; To build for ESP8266:
;   pio run -e esp8266_default
;   pio run -e esp8266_bootloader
;   pio run -e esp8266_kernel
; 
; To build for ESP32:
;   pio run -e esp32_default
;   pio run -e esp32_bootloader
;   pio run -e esp32_kernel
; 
; To build everything:
;   pio run -e esp8266_default -e esp32_default
; 
; To upload:
;   pio run -e upload_esp8266 -t upload
;   pio run -e upload_esp32 -t upload
; 
; The build system automatically detects the platform at compile time
; using ESP8266 or ESP32 preprocessor definitions.
; 
; ============================================================================
